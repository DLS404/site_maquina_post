<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máquina de Post</title>
    <link rel="stylesheet" href="style.css">
    <script>
        /* aplica o tema salvo antes de desenhar a página (evita piscar) */
        try {
            var savedTheme = localStorage.getItem("tema");
            if (savedTheme) {
                document.documentElement.setAttribute("data-theme", savedTheme);
            }
        } catch (e) {}
    </script>
</head>

<body>

<header>
    <h1>Máquina de Post</h1>
    <button id="themeButton" onclick="toggleTheme()">Tema escuro</button>
</header>

<div class="toolbar">

    <div class="tool-group">
    <button onclick="addNode('partida')">Partida</button>
    <button onclick="addNode('atribuicao')">Atribuição</button>
    <button onclick="addNode('teste')">Teste</button>
    <button onclick="addNode('aceita')">Aceita</button>
    <button onclick="addNode('rejeita')">Rejeita</button>
</div>

    <div class="tool-group">
        <button onclick="startConnectionMode()">Conectar</button>
        <button onclick="deleteSelected()">Excluir</button>
        <button onclick="undo()">Desfazer</button>
        <button id="selectModeButton" class="touch-only" onclick="toggleSelectMode()">Selecionar área</button>
        <button onclick="newMachine()">Nova máquina</button>
        <button onclick="loadExample()">Exemplo</button>
    </div>

</div>

<main>

    <section class="editor">

        <div class="editor-title">
            <strong>Área de construção</strong>
            <span id="modeText">Modo: seleção</span>
        </div>

        <p class="touch-hint">Arraste o fundo para mover a tela. Arraste um estado para movê-lo.</p>

        <div id="canvasScroll" class="canvas-scroll">
        <div id="canvas">

            <svg id="connections">
                <defs>
                    <marker
                        id="arrow"
                        markerWidth="10"
                        markerHeight="10"
                        refX="9"
                        refY="3"
                        orient="auto"
                        markerUnits="strokeWidth">

                        <path d="M0,0 L0,6 L9,3 z"></path>

                    </marker>
                </defs>
            </svg>

            <div id="nodes"></div>

        </div>
        </div>

    </section>

    <aside>

        <section class="panel">

            <h2>Propriedades</h2>

            <div id="properties">
                <p class="empty">
                    Selecione uma operação ou conexão.
                </p>
            </div>

        </section>

        <section class="panel">

            <h2>Fila</h2>

            <div class="queue-input">

                <input
                    type="text"
                    id="inputWord"
                    placeholder="Ex.: 0101">

                <button onclick="setInputWord()">Definir</button>

            </div>

            <div id="queue" class="queue">
                ε
            </div>

        </section>

        <section class="panel">

            <h2>Execução</h2>

            <div class="execution-buttons">

                <button onclick="executeMachine()">
                    Executar
                </button>

                <button onclick="stepMachine()">
                    Passo
                </button>

                <button onclick="pauseMachine()">
                    Pausar
                </button>

                <button onclick="resetExecution()">
                    Resetar
                </button>

            </div>

            <div class="speed">
                <label for="speedSelect">Velocidade</label>
                <select id="speedSelect" onchange="changeSpeed()">
                    <option value="1000">Lenta (1 s)</option>
                    <option value="500" selected>Normal (0,5 s)</option>
                    <option value="150">Rápida</option>
                    <option value="40">Muito rápida</option>
                    <option value="5">Máxima</option>
                </select>
            </div>

            <div id="executionStatus" class="status">
                Parada.
            </div>

        </section>

        <section class="panel">

            <h2>Validação</h2>

            <button onclick="validateMachine()" class="validate">
                Validar
            </button>

            <div id="validationResult"></div>

        </section>

    </aside>

</main>

<script src="script.js"></script>

<script>
    function currentTheme() {
        return document.documentElement.getAttribute("data-theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }

    function updateThemeButton() {
        document.getElementById("themeButton").textContent =
            currentTheme() === "dark" ? "Tema claro" : "Tema escuro";
    }

    function toggleTheme() {
        var next = currentTheme() === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("tema", next); } catch (e) {}
        updateThemeButton();
    }

    updateThemeButton();
</script>

</body>
</html>
