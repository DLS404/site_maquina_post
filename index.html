<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Máquina de Post</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Simulador de Máquina de Post</h1>
    <p>Crie, conecte e execute uma Máquina de Post.</p>
</header>

<div class="toolbar">

    <div class="tool-group">
        <button onclick="addNode('partida')">＋ Partida</button>
        <button onclick="addNode('teste')">＋ Teste</button>
        <button onclick="addNode('atribuicao')">＋ Atribuição</button>
        <button onclick="addNode('aceita')">＋ Aceita</button>
        <button onclick="addNode('rejeita')">＋ Rejeita</button>
    </div>

    <div class="tool-group">
        <button onclick="startConnectionMode()">🔗 Conectar</button>
        <button onclick="deleteSelected()">🗑 Excluir</button>
        <button onclick="newMachine()">📄 Nova máquina</button>
        <button onclick="loadExample()">💡 Exemplo</button>
    </div>

</div>

<main>

    <section class="editor">

        <div class="editor-title">
            <strong>Área de construção</strong>
            <span id="modeText">Modo: seleção</span>
        </div>

        <div id="canvas">

            <svg id="connections">
                <defs>
                    <marker
                        id="arrow"
                        markerWidth="10"
                        markerHeight="10"
                        refX="9"
                        refY="3"
                        orient="auto"
                        markerUnits="strokeWidth">

                        <path d="M0,0 L0,6 L9,3 z"></path>

                    </marker>
                </defs>
            </svg>

            <div id="nodes"></div>

        </div>

    </section>

    <aside>

        <section class="panel">

            <h2>Propriedades</h2>

            <div id="properties">
                <p class="empty">
                    Selecione uma operação ou conexão.
                </p>
            </div>

        </section>

        <section class="panel">

            <h2>Fila</h2>

            <div class="queue-input">

                <input
                    type="text"
                    id="inputWord"
                    placeholder="Ex.: 0101">

                <button onclick="setInputWord()">Definir</button>

            </div>

            <div id="queue" class="queue">
                ε
            </div>

        </section>

        <section class="panel">

            <h2>Execução</h2>

            <div class="execution-buttons">

                <button onclick="executeMachine()">
                    ▶ Executar
                </button>

                <button onclick="stepMachine()">
                    ⏭ Passo
                </button>

                <button onclick="pauseMachine()">
                    ⏸ Pausar
                </button>

                <button onclick="resetExecution()">
                    ↺ Resetar
                </button>

            </div>

            <div id="executionStatus" class="status">
                Máquina parada.
            </div>

        </section>

        <section class="panel">

            <h2>Validação</h2>

            <button onclick="validateMachine()" class="validate">
                ✓ Validar máquina
            </button>

            <div id="validationResult"></div>

        </section>

    </aside>

</main>

<script src="script.js"></script>

</body>
</html>
